<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <title>Panel de administración | MediPrint</title>

    <link rel="icon" type="image/png" href="../images/mediprint-logo.png">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="admin.css">
</head>

<body class="adm-body">

    <div id="admApp" class="adm-app" aria-busy="true">
        <div class="adm-state adm-state--page" role="status">
            <span class="adm-spinner" aria-hidden="true"></span>
            <p>Cargando panel…</p>
        </div>
    </div>

    <div id="admToasts" class="adm-toasts" role="status" aria-live="polite"></div>
    <div id="admAlerts" class="adm-toasts adm-toasts--alerts" role="alert" aria-live="assertive"></div>

    <noscript>
        <p class="adm-noscript">El panel de administración requiere JavaScript.</p>
    </noscript>

    <script src="../js/supabase-config.js"></script>
    <script src="vendor/supabase-js-2.116.0.js"></script>
    <script type="module" src="js/main.js"></script>
</body>

</html>
