<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cotiza tu Pedido | MediPrint</title>

    <meta name="description"
        content="Solicita una cotización personalizada de impresión médica y digital con MediPrint.">

    <!-- OPEN GRAPH -->
    <meta property="og:type" content="website">
    <meta property="og:locale" content="es_CL">
    <meta property="og:site_name" content="MediPrint">
    <meta property="og:title" content="Cotiza tu Pedido | MediPrint">
    <meta property="og:description"
        content="Solicita una cotización personalizada de impresión médica y digital con MediPrint.">
    <meta property="og:image" content="images/mediprint-logo.png">

    <link rel="icon" type="image/png" href="images/mediprint-logo.png">
    <link rel="stylesheet" href="style.css">

    <style>
        .quote-page {
            min-height: 100vh;
            padding: 60px 20px;
            background: #f5f5f5;
        }

        .quote-container {
            max-width: 750px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .quote-container h1 {
            margin-bottom: 10px;
        }

        .quote-description {
            color: #666;
            margin-bottom: 30px;
        }

        .quote-form {
            display: grid;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-group label {
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font: inherit;
            box-sizing: border-box;
        }

        .form-group textarea {
            min-height: 130px;
            resize: vertical;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .quote-submit {
            width: 100%;
            border: none;
            padding: 16px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            background: #111;
            color: white;
        }

        .quote-submit:hover {
            opacity: 0.85;
        }

        .back-home {
            display: inline-block;
            margin-bottom: 25px;
            text-decoration: none;
            color: #111;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            .quote-container {
                padding: 25px 20px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <main class="quote-page">

        <div class="quote-container">

            <a href="index.html" class="back-home">
                ← VOLVER A MEDIPRINT
            </a>

            <h1>Solicita tu cotización</h1>

            <p class="quote-description">
                Cuéntanos qué necesitas y envíanos los detalles directamente por WhatsApp.
            </p>

            <form id="quoteForm" class="quote-form">

                <div class="form-row">

                    <div class="form-group">
                        <label for="name">Nombre *</label>
                        <input type="text" id="name" required>
                    </div>

                    <div class="form-group">
                        <label for="company">Empresa</label>
                        <input type="text" id="company">
                    </div>

                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label for="phone">Teléfono *</label>
                        <input type="tel" id="phone" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Correo electrónico *</label>
                        <input type="email" id="email" required>
                    </div>

                </div>

                <div class="form-group">
                    <label for="product">Producto o servicio *</label>

                    <input
                        type="text"
                        id="product"
                        placeholder="Ej: Pendón, tarjetas, impresión, diseño..."
                        required
                    >
                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label for="quantity">Cantidad *</label>
                        <input type="number" id="quantity" min="1" required>
                    </div>

                    <div class="form-group">
                        <label for="date">Fecha requerida</label>
                        <input type="date" id="date">
                    </div>

                </div>

                <div class="form-group">
                    <label for="description">Descripción del trabajo *</label>

                    <textarea
                        id="description"
                        placeholder="Cuéntanos medidas, colores, material, diseño o cualquier detalle importante."
                        required
                    ></textarea>
                </div>

                <button type="submit" class="quote-submit">
                    ENVIAR COTIZACIÓN POR WHATSAPP
                </button>

            </form>

        </div>

    </main>

    <script>
        const quoteForm = document.getElementById('quoteForm');

        quoteForm.addEventListener('submit', function(event) {

            event.preventDefault();

            const name = document.getElementById('name').value;
            const company = document.getElementById('company').value;
            const phone = document.getElementById('phone').value;
            const email = document.getElementById('email').value;
            const product = document.getElementById('product').value;
            const quantity = document.getElementById('quantity').value;
            const date = document.getElementById('date').value;
            const description = document.getElementById('description').value;

            const message = `Hola MediPrint, quiero solicitar una cotización.

DATOS DEL CLIENTE

Nombre: ${name}
Empresa: ${company || 'No indicada'}
Teléfono: ${phone}
Correo: ${email}

DETALLE DE LA COTIZACIÓN

Producto/servicio: ${product}
Cantidad: ${quantity}
Fecha requerida: ${date || 'No indicada'}

Descripción:
${description}`;

            const whatsappNumber = '56926218660';

            window.open(
                `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`,
                '_blank'
            );
        });
    </script>

</body>

</html>
